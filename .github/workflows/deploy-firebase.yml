name: Firebase Production Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Control Plane
        run: npm run validate:control-plane

      - name: Run production quality gate
        run: npm run validate:ci

      - name: Reject stale main commits
        shell: bash
        run: |
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$GITHUB_SHA"

      - name: Deploy Firebase Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GAMEFINDER_B6A00 }}'
          projectId: gamefinder-b6a00
          channelId: live
          entryPoint: .

      - name: Verify live deployment
        shell: bash
        run: |
          expected="$(cat public/health.txt)"
          for attempt in $(seq 1 12); do
            actual="$(curl -fsSL --max-time 10 https://gamefinder-b6a00.web.app/health.txt || true)"
            if [ "$actual" = "$expected" ]; then
              echo "Live marker verified: $actual"
              exit 0
            fi
            echo "Attempt $attempt/12: live marker is '$actual', expected '$expected'"
            sleep 10
          done
          echo "Firebase live verification failed"
          exit 1
