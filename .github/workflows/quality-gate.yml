name: quality-gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate GameFinder
        shell: bash
        run: |
          set -o pipefail
          npm run validate:ci 2>&1 | tee validation-report.txt

      - name: Upload validation report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gamefinder-validation-report
          path: validation-report.txt
          if-no-files-found: ignore
